# Render Blueprint: one Node web service that serves the built client and the WebSocket server.
# Create it in Render: Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: nine-palace-temple
    runtime: node
    # Free instances sleep after ~15 min idle (slow first load). Switch to "starter" to keep it always on.
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MAX_PLAYERS
        value: "150"
      # Offerings (incense, fruit) clear at midnight in this time zone.
      - key: TEMPLE_TZ
        value: America/Los_Angeles
      # Where the wish lanterns are kept: Upstash Redis (free; upstash.com → create a Redis database → its
      # REST URL and token). Without these they live in a file that the free plan wipes on every deploy.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Optional: lets you take a lantern down by hand (see README). Render asks for the value.
      - key: ADMIN_KEY
        sync: false
