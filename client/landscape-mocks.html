<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Landscape Mocks</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9db4c4; font: 13px system-ui, sans-serif; color: #2c3a44; }
      canvas { display: block; width: 100vw; height: 100vh; cursor: zoom-in; }
      body.open canvas { cursor: grab; }
      .label { position: fixed; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.78); pointer-events: none; }
      .label.hidden { display: none; }
      .hint { position: fixed; right: 12px; bottom: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.65); pointer-events: none; }
      body:not(.open)::before, body:not(.open)::after { content: ''; position: fixed; background: rgba(255, 255, 255, 0.85); pointer-events: none; }
      body:not(.open)::before { top: 50%; left: 0; right: 0; height: 2px; margin-top: -1px; }
      body:not(.open)::after { left: 50%; top: 50%; bottom: 0; width: 2px; margin-left: -1px; }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div class="label">A · 梯田 Terraced hills</div>
    <div class="label">B · 山水 Karst peaks</div>
    <div class="label">C · 雪山 Himalayan</div>
    <div class="hint">click a view to look round it · click or Esc to go back</div>
    <script type="module" src="/src/dev/landscapeMocks.ts"></script>
  </body>
</html>
