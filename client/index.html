<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>辰霖學院 · Chenlin Academy</title>
    <!-- what you see first, fetched before the scripts ask for it (see src/core/loadQueue.ts) -->
    <link rel="preload" as="image" href="/assets/sky/milkyway-eso.jpg" fetchpriority="high" crossorigin="anonymous" />
    <link rel="preload" as="image" href="/assets/flags/lungta.jpg" fetchpriority="high" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Noto+Serif+TC:wght@500;600&display=swap" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%238e2b1f'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23d9a441'/%3E%3C/svg%3E" />
    <style>
      /* Loading screen (in the page itself, so it shows before any script has loaded): an ensō drawn as the
         temple loads, the name beside it, a seal; it fades to the start page (see main.ts). */
      .loader { position: fixed; inset: 0; z-index: 60; background: #fff; display: grid; place-items: center; transition: opacity 1.4s ease 0.5s; --p: 0.06; }
      .loader.done { opacity: 0; pointer-events: none; }
      .loader-in { display: grid; place-items: center; gap: 18px; transition: opacity 0.6s ease; }
      .loader.done .loader-in { opacity: 0; }
      .loader-mark { position: relative; } /* just the circle, so it sits in the middle; the name hangs beside it */
      .loader-circle { position: relative; display: grid; place-items: center; }
      .loader-circle svg { width: 150px; height: 150px; overflow: visible; }
      .loader .enso { fill: none; stroke: #1c1a18; stroke-width: 9; stroke-linecap: round; stroke-dasharray: 520; stroke-dashoffset: calc(520 - 470 * var(--p)); transition: stroke-dashoffset 0.8s ease; filter: url(#brush); }
      .loader-name { position: absolute; left: calc(100% + 22px); top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; font: 600 30px "Noto Serif TC", "Songti TC", serif; letter-spacing: 0.3em; color: #1c1a18; white-space: nowrap; }
      .loader-seal { position: absolute; transform: translate(64px, 54px) rotate(-6deg); width: 34px; height: 34px; }
      .loader-caps { font: 500 11px Cinzel, serif; letter-spacing: 0.5em; padding-left: 0.5em; color: #8b857c; }
      .loader-line { width: 180px; height: 1px; background: #e6e1d8; position: relative; overflow: hidden; }
      .loader-line span { position: absolute; inset: 0; background: #1c1a18; transform-origin: left; transform: scaleX(var(--p)); transition: transform 0.8s ease; }
    </style>
  </head>
  <body>
    <div id="loader" class="loader" role="progressbar" aria-label="Loading">
      <svg width="0" height="0" style="position: absolute"><filter id="brush"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n" /><feDisplacementMap in="SourceGraphic" in2="n" scale="5" /></filter></svg>
      <div class="loader-in">
        <div class="loader-mark">
          <div class="loader-circle">
            <svg viewBox="0 0 200 200"><path class="enso" d="M118,28 C160,38 182,78 172,118 C162,160 120,182 82,172 C42,160 20,120 30,82 C38,52 62,32 92,27" /></svg>
            <!-- the seal: a seated Buddha carved in the style of a seal stamp (assets/brand/seal.svg) -->
            <img class="loader-seal" src="assets/brand/seal.svg" alt="" />
          </div>
          <div class="loader-name">辰霖學院</div>
        </div>
        <div class="loader-caps">CHENLIN ACADEMY</div>
        <div class="loader-line"><span></span></div>
      </div>
    </div>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
